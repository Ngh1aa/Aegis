name: Aegis checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm test
        env:
          AEGIS_CAPTURES: captures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aegis-browser-evidence
          path: |
            captures
            test-results
          if-no-files-found: ignore
